name: Cross-platform stability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s test -p "test_*.py"
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Check native desktop backend
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) python -c 'import webview.platforms.cocoa' ;;
            Windows) python -c 'import webview.platforms.edgechromium' ;;
            Linux)
              python -m pip install 'pywebview[pyside6]>=5.4,<6'
              QT_QPA_PLATFORM=offscreen python -c 'import webview.platforms.qt'
              ;;
          esac

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:ui
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.browser }}
          path: .data/qa/
          include-hidden-files: true
