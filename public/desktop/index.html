<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Codex Pocket</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="desktop-app" class="desktop-app" aria-busy="true">
      <aside class="sidebar">
        <div class="brand" aria-label="Codex Pocket">
          <strong>Codex</strong>
          <span>Pocket</span>
        </div>

        <nav aria-label="桌面控制">
          <button class="nav-item" type="button" aria-current="page">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16.5Z"></path><path d="m9 10 2 2-2 2M13 14h2"></path></svg>
            <span>远程访问</span>
          </button>
        </nav>

        <div class="sidebar-status">
          <span class="status-label">连接状态</span>
          <div class="status-line">
            <span id="status-dot" class="status-dot" data-phase="stopped" aria-hidden="true"></span>
            <span id="status-text">服务已停止</span>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="toolbar">
          <div class="toolbar-title">
            <h1 id="remote-access-heading">远程访问</h1>
            <p>在手机上继续当前 Codex 会话</p>
          </div>
          <button id="service-button" class="command-button service-button primary" type="button" disabled>
            <svg class="start-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 7 8 5-8 5Z"></path></svg>
            <svg class="stop-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg>
            <span>开启服务</span>
          </button>
        </header>

        <section class="content" aria-labelledby="remote-access-heading" aria-describedby="connection-description">
          <div class="section-intro">
            <p id="connection-description">开启服务后，这里会生成本次连接专用的公网链接和访问密钥。</p>
          </div>

          <div id="error-banner" class="error-banner" role="alert" hidden>
            <span class="error-mark" aria-hidden="true"></span>
            <span id="error-text"></span>
            <button id="dismiss-error" class="icon-button" type="button" aria-label="关闭错误提示" title="关闭错误提示">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"></path></svg>
            </button>
          </div>

          <div class="connection-fields">
            <section class="field-section" aria-labelledby="url-label">
              <div class="field-heading">
                <label id="url-label">公网链接</label>
                <div class="field-actions">
                  <button id="copy-url" class="icon-button" type="button" aria-label="复制公网链接" title="复制公网链接" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
                  </button>
                  <button id="open-url" class="icon-button" type="button" aria-label="在浏览器中打开公网链接" title="在浏览器中打开" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 5h5v5M12 12l7-7"></path><path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path></svg>
                  </button>
                </div>
              </div>
              <div class="value-row">
                <code id="public-url">服务启动后生成</code>
              </div>
            </section>

            <section class="field-section" aria-labelledby="key-label">
              <div class="field-heading">
                <label id="key-label">访问密钥</label>
                <div class="field-actions">
                  <button id="copy-key" class="icon-button" type="button" aria-label="复制访问密钥" title="复制访问密钥" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
                  </button>
                </div>
              </div>
              <div class="value-row">
                <code id="access-key">服务启动后生成</code>
              </div>
            </section>
          </div>

          <footer class="security-note">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            <p>停止服务后，本次链接和密钥立即失效。</p>
          </footer>
        </section>
      </main>

      <div id="copy-toast" class="copy-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path class="toast-success-mark" d="m6 12 4 4 8-9"></path>
          <path class="toast-error-mark" d="m7 7 10 10M17 7 7 17"></path>
        </svg>
        <span id="copy-toast-text"></span>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
