<!doctype html>
<html lang="zh-CN" data-theme-storage="desktop">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Codex Pocket</title>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="desktop-app" class="desktop-app" aria-busy="true">
      <aside class="sidebar">
        <div class="brand" aria-label="Codex Pocket">
          <strong>Codex Pocket</strong>
        </div>

        <nav aria-label="桌面控制">
          <button class="nav-item" type="button" aria-current="page">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16.5Z"></path><path d="m9 10 2 2-2 2M13 14h2"></path></svg>
            <span>远程访问</span>
          </button>
        </nav>

        <div class="sidebar-status">
          <button class="settings-button settings-icon-button" data-settings-button type="button" aria-label="设置" title="设置" aria-haspopup="dialog" aria-controls="appearance-settings" aria-expanded="false"><span class="settings-gear" aria-hidden="true"></span></button>
          <div class="status-line">
            <span id="status-dot" class="status-dot" data-phase="stopped" aria-hidden="true"></span>
            <span id="status-text">服务已停止</span>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="toolbar">
          <button class="settings-button settings-icon-button settings-compact" data-settings-button type="button" aria-label="设置" title="设置" aria-haspopup="dialog" aria-controls="appearance-settings" aria-expanded="false"><span class="settings-gear" aria-hidden="true"></span></button>
        </header>

        <section class="content" aria-labelledby="connection-heading">
          <div class="section-intro">
            <div class="section-heading">
              <span class="device-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"></rect><path d="M10 18h4"></path></svg></span>
              <h2 id="connection-heading">连接你的设备</h2>
              <div class="connection-status">
                <p id="connection-description" role="status">服务未开启</p>
                <div class="connection-mode-group">
                  <span id="connection-mode" data-mode="unknown">模式待检测</span>
                  <details class="connection-mode-details">
                    <summary aria-label="连接模式说明" title="连接模式说明"><span aria-hidden="true">?</span></summary>
                    <div class="connection-mode-help"><strong id="connection-mode-current">当前模式：检测中</strong><span id="connection-mode-advice">正在读取连接状态。</span><button id="connect-desktop" class="show-qr-button" type="button" hidden>连接桌面 App</button></div>
                  </details>
                </div>
              </div>
            </div>
            <button id="service-button" class="command-button service-button primary" type="button" disabled>
            <svg class="start-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 7 8 5-8 5Z"></path></svg>
            <svg class="stop-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8" rx="1"></rect></svg>
            <span>开启服务</span>
            </button>
          </div>

          <div id="error-banner" class="error-banner" role="alert" hidden>
            <span class="error-mark" aria-hidden="true"></span>
            <span id="error-text"></span>
            <button id="dismiss-error" class="icon-button" type="button" aria-label="关闭错误提示" title="关闭错误提示">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"></path></svg>
            </button>
          </div>

          <div class="connection-options">
            <div class="connection-fields">
            <section class="field-section" aria-labelledby="url-label">
              <div class="field-heading">
                <label id="url-label">访问地址</label>
              </div>
              <div class="value-row">
                <span id="public-url" class="field-value">服务启动后生成</span>
                <div class="field-actions">
                  <button id="copy-url" class="icon-button" type="button" aria-label="复制公网链接" title="复制公网链接" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
                  </button>
                  <button id="open-url" class="icon-button" type="button" aria-label="在浏览器中打开公网链接" title="在浏览器中打开" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 5h5v5M12 12l7-7"></path><path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path></svg>
                  </button>
                </div>
              </div>
            </section>

            <section class="field-section" aria-labelledby="key-label">
              <div class="field-heading">
                <label id="key-label">访问密钥</label>
              </div>
              <div class="value-row">
                <code id="access-key" class="field-value field-value-secret">服务启动后生成</code>
                <div class="field-actions">
                  <button id="copy-key" class="icon-button" type="button" aria-label="复制访问密钥" title="复制访问密钥" disabled>
                    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
                  </button>
                </div>
              </div>
            </section>
            </div>
            <button id="show-qr" class="command-button show-qr-button" type="button" aria-haspopup="dialog" aria-controls="qr-dialog" disabled>
              <span class="qr-open-icon" aria-hidden="true"></span>
              <span>通过二维码连接</span>
            </button>
          </div>

        </section>
      </main>

      <dialog id="qr-dialog" class="qr-dialog" aria-labelledby="scan-label">
        <div class="scan-heading">
          <h3 id="scan-label" tabindex="-1" autofocus>扫码直连</h3>
          <div class="field-actions">
            <button id="copy-qr" class="icon-button" type="button" aria-label="复制二维码" title="复制二维码" disabled>
              <span class="qr-copy-icon" aria-hidden="true"></span>
            </button>
            <button id="close-qr" class="icon-button" type="button" aria-label="关闭二维码" title="关闭">
              <span class="qr-close-icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="qr-frame">
          <img id="connection-qr" alt="手机直连二维码" hidden>
          <span id="qr-placeholder" role="status">服务未开启</span>
        </div>
        <p id="qr-copy-status" class="qr-copy-status" role="status" aria-live="polite"></p>
      </dialog>

      <div id="copy-toast" class="copy-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path class="toast-success-mark" d="m6 12 4 4 8-9"></path>
          <path class="toast-error-mark" d="m7 7 10 10M17 7 7 17"></path>
        </svg>
        <span id="copy-toast-text"></span>
      </div>
    </div>

    <script src="../vendor/qrcode.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
